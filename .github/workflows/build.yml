name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev zlib1g-dev \
                                openjdk-17-jdk zip unzip ccache autoconf libtool pkg-config wget

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade buildozer "cython<3.0.0"

    - name: Setup Android SDK Tools & Fix Paths
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        cd ~/.buildozer/android/platform/android-sdk/cmdline-tools
        
        # Скачиваем официальные cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        rm commandlinetools-linux-11076708_latest.zip
        
        # Связываем старый путь tools со свежим cmdline-tools/latest для Buildozer
        cd ~/.buildozer/android/platform/android-sdk
        if [ ! -d "tools" ]; then
          ln -s cmdline-tools/latest tools
        fi
        
        # Принимаем лицензии SDK
        yes | tools/bin/sdkmanager --licenses || true

    - name: Build APK with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: elk-led-app-debug
        path: bin/*.apk
